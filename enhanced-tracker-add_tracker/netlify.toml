[build]
base = "enhanced-tracker-add_tracker"
publish = "client/build"
command = "cd server && npm install && npx prisma generate --schema=./prisma/schema.prisma && cd .. && mkdir -p node_modules && cp -r server/node_modules/@prisma node_modules/ && cp -r server/node_modules/.prisma node_modules/ && cd client && npm install && npm run build"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
included_files = ["server/prisma/schema.prisma", "server/node_modules/.prisma/**"]
# Route /api/* requests to your Express serverless function
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true
# Support client-side routing for the React SPA
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
